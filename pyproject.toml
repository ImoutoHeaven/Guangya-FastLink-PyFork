[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guangya-fastlink"
version = "0.1.0"
description = "Guangya cloud-drive rapid-transfer CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ijson>=3.3.0"]

[project.scripts]
guangya-fastlink = "guangya_fastlink.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["guangya_fastlink*"]
